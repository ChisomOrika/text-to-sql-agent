    expected_tables: ["client_services.contracts"]
    expects_disambiguation: false
    expects_warning: false
    expected_warning_keywords: []
    notes: "Date comparison filter on contracts."

  - id: "A10"
    category: "simple_lookup"
    difficulty: "easy"
    question: "What is our total budget for 2026?"
    expected_tables: ["finance.budgets"]
    expects_disambiguation: false
    expects_warning: false
    expected_warning_keywords: []
