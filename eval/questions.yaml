questions:
  # ============================================================
  # Category A: simple_lookup (10 questions)
  # Single table, simple aggregation or filter
  # ============================================================
  - id: "A01"
    category: "simple_lookup"
    difficulty: "easy"
    question: "How many active clients do we have?"
    expected_tables: ["client_services.clients"]
    expects_disambiguation: false
    expects_warning: false
    expected_warning_keywords: []
    notes: "Basic count with a status filter on the clients table."

  - id: "A02"
    category: "simple_lookup"
    difficulty: "easy"
    question: "List all departments and their headcount."
    expected_tables: ["operations.departments"]
    expects_disambiguation: false
    expects_warning: false
    expected_warning_keywords: []
    notes: "Simple select/aggregation on a single operations table."

  - id: "A03"
    category: "simple_lookup"
    difficulty: "easy"
    question: "What is the total amount in accounts receivable?"
    expected_tables: ["finance.accounts_receivable"]
    expects_disambiguation: false
